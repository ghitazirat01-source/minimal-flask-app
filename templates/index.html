<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ordinary Object Museum</title>
</head>

<body>

    <h1>Turn Your Object Into Art</h1>

    <p>
        Describe an ordinary object from your pocket, bag, or desk.
    </p>

    <form method="POST">

        <input
            type="text"
            name="object_description"
            placeholder="e.g. an old blue pen with bite marks"
            required
        >

        <button type="submit">
            Turn It Into Art
        </button>

    </form>

    {% if object_description %}
        <h2>Your object:</h2>
        <p>{{ object_description }}</p>
    {% endif %}

</body>

</html>
